
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mbira Couture{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'mbiracouture_app/styles.css' %}">
</head>
<body>
    <header>
        <h1>{% block header %}Mbira Couture{% endblock %}</h1>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; {% now "Y" %} Mbira Couture</p>
    </footer>
</body>
</html>
