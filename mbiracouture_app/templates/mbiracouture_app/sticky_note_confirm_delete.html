
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Sticky Note</title>
    <link rel="stylesheet" href="{% static 'mbiracouture_app/styles.css' %}">
</head>
<body>
    <h1>Delete Sticky Note</h1>

    <p>Are you sure you want to delete "{{ note.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'sticky_note_list' %}">Cancel</a>
    </form>
</body>
</html>
